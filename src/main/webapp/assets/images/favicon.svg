<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="smGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded hexagon -->
  <rect width="48" height="48" rx="12" fill="#0f172a"/>
  <rect width="46" height="46" x="1" y="1" rx="11" fill="none" stroke="url(#smGrad)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Open Book & Digital Nodes Symbol -->
  <g filter="url(#glow)">
    <!-- Left book page -->
    <path d="M 24 35 C 20 32 14 32 10 33 L 10 20 C 14 19 20 19 24 22 Z" fill="url(#smGrad)" fill-opacity="0.85"/>
    <!-- Right book page -->
    <path d="M 24 35 C 28 32 34 32 38 33 L 38 20 C 34 19 28 19 24 22 Z" fill="url(#smGrad)"/>
    <!-- Center spine line -->
    <line x1="24" y1="21" x2="24" y2="36" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <!-- Graduation Cap Symbol above Book -->
    <polygon points="24,9 35,14 24,19 13,14" fill="url(#capGrad)"/>
    <!-- Cap base -->
    <path d="M 18 16.5 L 18 20 C 18 21.8 20.7 23 24 23 C 27.3 23 30 21.8 30 20 L 30 16.5" fill="none" stroke="url(#capGrad)" stroke-width="1.5"/>
    <!-- Tassel -->
    <path d="M 33 14.5 L 35 19 L 34 23" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="34" cy="23.5" r="1" fill="#38bdf8"/>
  </g>
</svg>

